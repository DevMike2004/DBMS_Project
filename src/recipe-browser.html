<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Browser</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .filter-form {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
            gap: 12px;
            margin-bottom: 30px;
        }

        .filter-form label {
            display: flex;
            flex-direction: column;
            text-align: left;
            font-size: 14px;
            color: #333;
            gap: 4px;
        }

        .filter-form input,
        .filter-form select {
            padding: 10px;
            font-size: 15px;
            border: 1px solid #999;
            border-radius: 6px;
            background-color: #fff;
        }

        .filter-form input[type="number"] {
            width: 110px;
        }

        .action-button {
            padding: 11px 20px;
            font-size: 16px;
            border: 1px solid #333;
            border-radius: 6px;
            cursor: pointer;
            background-color: #333;
            color: #fff;
        }

        .action-button:hover {
            background-color: #555;
        }

        .action-button.secondary {
            background-color: #fff;
            color: #333;
            border-color: #999;
        }

        .action-button.secondary:hover {
            background-color: #555;
            color: #fff;
        }

        #results table {
            width: 800px;
            max-width: 100%;
        }

        #results th,
        #results td {
            padding: 8px;
        }

        #results a {
            color: #333;
            font-weight: bold;
        }

        .message {
            color: #333;
        }

        .error {
            color: #b00020;
        }
    </style>
</head>
<body class="site-page">
    <div class="home-bar">
        <a href="/" class="home-button">Home</a>
    </div>

    <main class="page-content">
        <h1>Recipe Browser</h1>

        <!-- Also works without JavaScript: the form then opens the /api/recipes results page -->
        <form id="filters" class="filter-form" action="/api/recipes" method="GET">
            <label>
                Search
                <input type="text" name="search" placeholder="Recipe title">
            </label>
            <label>
                Tag
                <select name="tag" id="tag-select">
                    <option value="">Any tag</option>
                </select>
            </label>
            <label>
                Max cost per serving ($)
                <input type="number" name="max_cost" min="0" step="0.01">
            </label>
            <label>
                Max time (minutes)
                <input type="number" name="max_minutes" min="0" step="1">
            </label>
            <button type="submit" class="action-button">Search</button>
            <button type="button" id="clear" class="action-button secondary">Clear</button>
        </form>

        <div id="results"><p class="message">Loading recipes...</p></div>
    </main>

    <script>
        // The API routes return finished HTML pages, so this reads the tables out of them.
        async function fetchPage(url) {
            const res = await fetch(url);
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, "text/html");
            return { ok: res.ok, doc: doc };
        }

        // Fill the Tag dropdown from GET /api/tags
        async function loadTags() {
            try {
                const { ok, doc } = await fetchPage("/api/tags");
                if (!ok) return;
                const select = document.getElementById("tag-select");
                const rows = doc.querySelectorAll("table tr");
                rows.forEach((row, i) => {
                    const cells = row.querySelectorAll("td");
                    if (i === 0 || cells.length < 2) return;   // skip heading / "No results"
                    const option = document.createElement("option");
                    option.value = cells[1].textContent;       // the filter matches by tag name
                    option.textContent = cells[1].textContent;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error("Could not load tags:", err);
            }
        }

        // Show recipes from GET /api/recipes with the current filters
        async function loadRecipes() {
            const results = document.getElementById("results");
            const params = new URLSearchParams();
            new FormData(document.getElementById("filters")).forEach((value, key) => {
                if (String(value).trim() !== "") params.append(key, String(value).trim());
            });

            results.innerHTML = '<p class="message">Loading recipes...</p>';
            try {
                const { ok, doc } = await fetchPage("/api/recipes?" + params.toString());
                if (!ok) {
                    // Show the API's error message (for example "max_cost must be a number.")
                    const msg = doc.querySelector("main p, p");
                    results.innerHTML = "";
                    const p = document.createElement("p");
                    p.className = "error";
                    p.textContent = msg ? msg.textContent : "Could not load recipes.";
                    results.appendChild(p);
                    return;
                }

                const table = doc.querySelector("table");
                results.innerHTML = "";
                results.appendChild(table);

                // Turn each title into a link to that recipe
                table.querySelectorAll("tr").forEach((row, i) => {
                    const cells = row.querySelectorAll("td");
                    if (i === 0 || cells.length < 2) return;
                    const id = cells[0].textContent;
                    const link = document.createElement("a");
                    link.href = "/api/recipes/" + encodeURIComponent(id);
                    link.textContent = cells[1].textContent;
                    cells[1].textContent = "";
                    cells[1].appendChild(link);
                });
            } catch (err) {
                console.error("Could not load recipes:", err);
                results.innerHTML = '<p class="error">Could not reach the server.</p>';
            }
        }

        document.getElementById("filters").addEventListener("submit", e => {
            e.preventDefault();
            loadRecipes();
        });

        document.getElementById("clear").addEventListener("click", () => {
            document.getElementById("filters").reset();
            loadRecipes();
        });

        loadTags();
        loadRecipes();
    </script>
</body>
</html>
